
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wish List - Travel Atlas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="wish-list.css">
    <script src="wish-list.js" defer></script>
</head>

<body>

    
<header class="site-header d-flex flex-column flex-sm-row align-items-center justify-content-between" id="top">

    <a href="home.html" class="brand d-flex align-items-center gap-2 fw-bold">
        <span class="brand-mark">
            <img src="./images/logo.png" alt="Travel Atlas logo">
        </span>
        <span>Travel Atlas</span>
    </a>

    <nav class="main-nav d-flex flex-wrap align-items-center justify-content-center gap-4">
        <a href="home.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="wish-list.html" class="active px-3 py-2 rounded-pill bg-success text-white">Wish List</a>
        <a href="my-atlas.html">My Atlas</a>
    </nav>

</header>


    <main class="container wishlist-container">

        <h1>My Wish List</h1>

        <p class="subtitle">Places you want to visit someday.</p>

        <div class="add-place">
            <input
                id="place-input"
                type="text"
                placeholder="Add a destination..."
            >

            <button id="add-button" type="button">Add</button>
        </div>

        <ul id="wishlist-items"></ul>

    </main>

</body>
</html>
